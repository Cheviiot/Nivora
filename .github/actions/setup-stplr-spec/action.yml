name: Подготовить stplr-spec
description: Устанавливает закреплённые Go, системные инструменты и stplr-spec

inputs:
  system-packages:
    description: Дополнительные пакеты Ubuntu через пробел
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Установить Go
      uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
      with:
        go-version: 1.26.5
        cache: false

    - name: Установить системные инструменты
      if: ${{ inputs.system-packages != '' }}
      shell: bash
      env:
        SYSTEM_PACKAGES: ${{ inputs.system-packages }}
      run: |
        sudo apt-get update
        read -r -a packages <<<"$SYSTEM_PACKAGES"
        sudo apt-get install -y "${packages[@]}"

    - name: Восстановить доверенный stplr-spec из cache
      id: stplr-spec-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      continue-on-error: true
      with:
        path: ${{ runner.temp }}/nivora-stplr-spec-bin
        key: nivora-stplr-spec-${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-go1.26.5-utils-c6ddbb5e4e5637d97bb7b2587729178d715c6c52-${{ hashFiles('.github/actions/setup-stplr-spec/action.yml', '.github/tools/prepare_stplr_spec.sh', '.github/tools/lib/pinned_git_checkout.sh') }}

    - name: Добавить каталог stplr-spec в PATH
      shell: bash
      run: |
        install -d "$RUNNER_TEMP/nivora-stplr-spec-bin"
        echo "$RUNNER_TEMP/nivora-stplr-spec-bin" >>"$GITHUB_PATH"

    - name: Собрать закреплённый stplr-spec при промахе cache
      id: compile-stplr-spec
      if: ${{ steps.stplr-spec-cache.outputs.cache-hit != 'true' }}
      shell: bash
      env:
        STPLR_UTILS_COMMIT: c6ddbb5e4e5637d97bb7b2587729178d715c6c52
      run: >-
        .github/tools/prepare_stplr_spec.sh
        "$RUNNER_TEMP/nivora-stplr-spec-bin/stplr-spec"
        https://altlinux.space/stapler/stplr-utils.git

    - name: Сохранить собранный stplr-spec в cache
      if: ${{ steps.stplr-spec-cache.outputs.cache-hit != 'true' && steps.compile-stplr-spec.outcome == 'success' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      continue-on-error: true
      with:
        path: ${{ runner.temp }}/nivora-stplr-spec-bin
        key: nivora-stplr-spec-${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-go1.26.5-utils-c6ddbb5e4e5637d97bb7b2587729178d715c6c52-${{ hashFiles('.github/actions/setup-stplr-spec/action.yml', '.github/tools/prepare_stplr_spec.sh', '.github/tools/lib/pinned_git_checkout.sh') }}
