schema_version = 2

[stapler]
stable_version = "0.1.1"
stable_commit = "b5e293f6442f3cba1eeeea4b53c3c0e0bc2ae3e1"
stable_linux_x86_64_url = "https://altlinux.space/stapler/stplr/releases/download/v0.1.1/stplr-0.1.1-linux-x86_64.tar.gz"
stable_linux_x86_64_sha256 = "b1ec1e98c04ab928377d0cef1706e3dc62171b9e256f4bf36a219addc53117b8"
main_commit = "9df2b9284d3a37cdc418cef2e77781bac3b8dc3e"
main_repository = "https://altlinux.space/stapler/stplr.git"

[images]
alt_p11 = "registry.altlinux.org/p11/base@sha256:8024e8175572804b1b6bcfde76d464d7e12bbd09583af067e8b1386ff6b123e9"

[expectations]
package_count = 15
target_count = 1
logical_runtime_cells = 23
declared_supported_runtime_cells = 23
verified_runtime_cells = 15
blocking_ci_build_cells_full_common_change = 15
advisory_main_build_cells_full_common_change = 15

[tiers]
verified = "build, package metadata, install, safe smoke and remove all run as required gates in a disposable ALT p11 container"
partial = "declared support with explicit caveats; the cell is not a required gate"
unsupported = "excluded from build and runtime scheduling"

[ci_coverage]
blocking_builders = ["alt-p11-x86_64"]
blocking_architectures = ["amd64", "noarch"]
lifecycle = "install, upgrade, smoke and remove in a disposable ALT p11 container"
main_canary = "advisory-alt-p11-x86_64"
pruning = "package-only changes build changed packages after full static validation; any common change builds every package on pull requests and main pushes"
# GitHub offers no ALT runner, so every gate runs in an official ALT container
# on an x86_64 runner. aarch64 is therefore declared but never gated: Stapler
# builds it from the recipe on the user's own machine.
ungated = "arm64"

[[targets]]
id = "alt-p11"
distro = "altlinux"
release = "p11"
branch_id = "p11"
format = "rpm"
manager = "apt-rpm"
libc = "glibc"
review_cadence = "nightly"
ci_mode = "blocking-lifecycle"
gated_architectures = ["amd64"]

[[packages]]
id = "anidesk"
architectures = ["amd64"]
smoke_path = "/usr/bin/anidesk"
support = [
  { targets = ["alt-p11"], architectures = ["amd64"], tier = "verified", caveats = ["external-service"] },
]

[[packages]]
id = "antigravity"
architectures = ["amd64", "arm64"]
smoke_path = "/usr/bin/antigravity"
support = [
  { targets = ["alt-p11"], architectures = ["amd64"], tier = "verified", caveats = ["login-required", "external-service"] },
  { targets = ["alt-p11"], architectures = ["arm64"], tier = "partial", caveats = ["arm64-not-gated", "login-required", "external-service"] },
]

