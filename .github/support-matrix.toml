schema_version = 1

[stapler]
stable_version = "0.1.1"
stable_commit = "b5e293f6442f3cba1eeeea4b53c3c0e0bc2ae3e1"
stable_linux_x86_64_url = "https://altlinux.space/stapler/stplr/releases/download/v0.1.1/stplr-0.1.1-linux-x86_64.tar.gz"
stable_linux_x86_64_sha256 = "b1ec1e98c04ab928377d0cef1706e3dc62171b9e256f4bf36a219addc53117b8"
main_commit = "9df2b9284d3a37cdc418cef2e77781bac3b8dc3e"
main_repository = "https://altlinux.space/stapler/stplr.git"

[images]
ubuntu_24_04 = "ubuntu:24.04@sha256:33ceb71981b602c1a7443a53469e4dba065f7503eab3078a2d7a57a2ab987517"
alt_sisyphus = "registry.altlinux.org/sisyphus/base@sha256:1a6ab67cc12cfbe2419ed8b805ae6fd75ed036f9da7211b78876d1cd0083b7ba"

[expectations]
package_count = 16
target_count = 10
logical_runtime_cells = 260
declared_supported_runtime_cells = 229
declared_unique_build_cells = 219
blocking_ci_build_cells_full_common_change = 16
blocking_ci_runtime_cells = 2
advisory_main_build_cells_full_common_change = 16

[tiers]
verified = "target-specific native build, package metadata, install, safe smoke and remove are required gates"
partial = "declared support with explicit caveats; complete target lifecycle is not a required gate"
experimental = "best-effort declaration; failures do not block and runtime support is unproven"
unsupported = "excluded from build and runtime scheduling"

[ci_coverage]
blocking_builder = "alt-sisyphus-x86_64"
blocking_architectures = ["amd64", "noarch"]
runtime = "nivora-cli on native ubuntu-24.04 amd64 and arm64"
main_canary = "advisory-alt-sisyphus-x86_64"
pruning = "changed package only; every package for .github or stapler-repo.toml changes"

[[targets]]
id = "debian-13"
distro = "debian"
release = "13"
format = "deb"
manager = "apt"
libc = "glibc"
review_cadence = "weekly"
ci_mode = "declared-only"

[[targets]]
id = "ubuntu-24.04"
distro = "ubuntu"
release = "24.04"
format = "deb"
manager = "apt"
libc = "glibc"
review_cadence = "weekly"
ci_mode = "blocking-runtime"
native_runners = { amd64 = "ubuntu-24.04", arm64 = "ubuntu-24.04-arm" }

[[targets]]
