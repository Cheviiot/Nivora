name: CI · Ручная сборка пакетов

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "all или package ID через пробел"
        required: true
        default: all
        type: string

permissions:
  contents: read

concurrency:
  group: nivora-clean-build
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Изолированная сборка ALT p11
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Выбрать пакеты
        id: plan
        env:
          REQUESTED_PACKAGES: ${{ inputs.packages }}
        run: >-
          .github/tools/ci_plan.py
          --packages "$REQUESTED_PACKAGES"
          --github-output "$GITHUB_OUTPUT"

      - name: Подготовить инструменты
        uses: ./.github/actions/setup-stplr-spec
        with:
          system-packages: jq rpm cpio sqlite3 shellcheck

      - name: Проверить обязательные G0–G2
        run: .github/tools/run_checks.sh

      - name: Собрать пакеты
        env:
          PACKAGES_JSON: ${{ steps.plan.outputs.packages }}
          NIVORA_STPLR_CHANNEL: stable
          NIVORA_ALT_BRANCH: p11
        run: |
          mapfile -t packages < <(jq -r '.[]' <<<"$PACKAGES_JSON")
          .github/tools/clean_build.sh "${packages[@]}"
          .github/tools/verify_artifacts.sh "${packages[@]}"
          NIVORA_LIFECYCLE_PACKAGES="$(IFS=,; echo "${packages[*]}")" \
            .github/tools/test_package_lifecycle.sh
