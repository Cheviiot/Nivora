name: CI · Сборка GitHub Desktop для Linux

on:
  workflow_call:
    inputs:
      version:
        description: "Версия desktop/desktop без префикса release-"
        required: true
        type: string
      publish:
        description: "Опубликовать tar.gz в GitHub Release Nivora"
        required: false
        default: true
        type: boolean
    outputs:
      upstream_commit:
        description: "Точный commit, из которого собраны обе архитектуры"
        value: ${{ jobs.resolve.outputs.commit }}
  workflow_dispatch:
    inputs:
      version:
        description: "Версия desktop/desktop без префикса release-"
        required: true
        default: "3.6.5"
        type: string
      publish:
        description: "Опубликовать tar.gz в GitHub Release Nivora"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: nivora-github-desktop-linux-${{ inputs.version || '3.6.5' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  resolve:
    name: Закрепить upstream commit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.pin.outputs.commit }}
    steps:
      - name: Разрешить release tag ровно один раз
        id: pin
        env:
          VERSION: ${{ inputs.version || '3.6.5' }}
        run: |
          commit="$({
            git ls-remote https://github.com/desktop/desktop.git \
              "refs/tags/release-${VERSION}^{}"
            git ls-remote https://github.com/desktop/desktop.git \
              "refs/tags/release-${VERSION}"
          } | awk 'NR == 1 { print $1 }')"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          echo "commit=$commit" >>"$GITHUB_OUTPUT"

  build:
    name: Linux ${{ matrix.arch }}
    needs: resolve
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - name: Установить Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.15.0"

      - name: Установить системные зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsecret-1-dev pkg-config python3

      - name: Получить официальные исходники GitHub Desktop
        env:
          UPSTREAM_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          git init github-desktop
          git -C github-desktop remote add origin \
            https://github.com/desktop/desktop.git
          git -C github-desktop fetch --depth 1 origin "$UPSTREAM_COMMIT"
          git -C github-desktop checkout --detach FETCH_HEAD
          [[ "$(git -C github-desktop rev-parse HEAD)" == "$UPSTREAM_COMMIT" ]]
          git -C github-desktop submodule update --init --recursive --depth 1

      - name: Добавить поддержку OAuth callback в Linux
        working-directory: github-desktop
        run: |
          main_process='app/src/main-process/main.ts'
          perl -0pi -e \
            "s/if \\(__DEV_SECRETS__\\) \\{\\n  possibleProtocols\\.add\\('x-github-desktop-dev-auth'\\)\\n\\} else \\{\\n  possibleProtocols\\.add\\('x-github-desktop-auth'\\)\\n\\}/possibleProtocols.add('x-github-desktop-auth')\\nif (__DEV_SECRETS__) {\\n  possibleProtocols.add('x-github-desktop-dev-auth')\\n}/" \
            "$main_process"
          perl -0pi -e \
            "s/if \\(__WIN32__ && args\\['protocol-launcher'\\] === true\\)/if ((__WIN32__ || __LINUX__) \\&\\& args['protocol-launcher'] === true)/" \
            "$main_process"
          grep -Fq "possibleProtocols.add('x-github-desktop-auth')" \
            "$main_process"
          grep -Fq "(__WIN32__ || __LINUX__)" "$main_process"

      - name: Установить зависимости из upstream lockfile
        working-directory: github-desktop
        run: |
          node vendor/yarn-1.21.1.js install --frozen-lockfile --non-interactive

      - name: Собрать официальный Electron-клиент
        working-directory: github-desktop
        env:
          NODE_ENV: production
          RELEASE_CHANNEL: production
        run: node vendor/yarn-1.21.1.js build:prod

      - name: Упаковать Linux-сборку
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ inputs.version || '3.6.5' }}
        run: |
          dist="github-desktop/dist/desktop-linux-${ARCH}"
          test -x "${dist}/desktop"
          grep -aFq 'x-github-desktop-auth' \
            "${dist}/resources/app/main.js"
          mkdir -p package/github-desktop
          cp -a "${dist}/." package/github-desktop/
          printf '%s\n' "$(git -C github-desktop rev-parse HEAD)" \
            >package/github-desktop/UPSTREAM_COMMIT
          tar \
            --sort=name \
            --mtime='UTC 2020-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -C package \
            -cf "github-desktop-${VERSION}-linux-${ARCH}.tar" \
            github-desktop
          gzip -n -9 "github-desktop-${VERSION}-linux-${ARCH}.tar"

      - name: Сохранить артефакт
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: github-desktop-${{ inputs.version || '3.6.5' }}-linux-${{ matrix.arch }}
          path: github-desktop-${{ inputs.version || '3.6.5' }}-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Опубликовать Linux-артефакты
    if: ${{ inputs.publish }}
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Скачать обе архитектуры
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: github-desktop-${{ inputs.version || '3.6.5' }}-linux-*
          merge-multiple: true

      - name: Создать контрольные суммы
        env:
          EXPECTED_COMMIT: ${{ needs.resolve.outputs.commit }}
          VERSION: ${{ inputs.version || '3.6.5' }}
        run: |
          artifacts=(github-desktop-*.tar.gz)
          [[ "${#artifacts[@]}" -eq 2 ]]
          for arch in x64 arm64; do
            artifact="github-desktop-${VERSION}-linux-${arch}.tar.gz"
            [[ -f "$artifact" ]]
            [[ "$(tar -xOf "$artifact" github-desktop/UPSTREAM_COMMIT)" == \
              "$EXPECTED_COMMIT" ]]
          done
          sha256sum "${artifacts[@]}" >SHA256SUMS

      - name: Создать или обновить GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version || '3.6.5' }}
        run: |
          tag="github-desktop-${VERSION}-linux"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "GitHub Desktop ${VERSION} for Linux" \
              --notes "Linux artifacts built by Nivora CI from exact official desktop/desktop commit ${{ needs.resolve.outputs.commit }} resolved from release-${VERSION}, with pinned submodules."
          fi
          expected_assets=(
            "github-desktop-${VERSION}-linux-x64.tar.gz"
            "github-desktop-${VERSION}-linux-arm64.tar.gz"
            SHA256SUMS
          )
          mapfile -t remote_assets < <(
            gh release view "$tag" --json assets --jq '.assets[].name'
          )
          complete=true
          for asset in "${expected_assets[@]}"; do
            printf '%s\n' "${remote_assets[@]}" | grep -Fxq "$asset" || complete=false
          done
          valid_remote=false
          if [[ "$complete" == true ]]; then
            existing_dir="$(mktemp -d)"
            trap 'find "$existing_dir" -mindepth 1 -delete; rmdir "$existing_dir"' EXIT
            for asset in "${expected_assets[@]}"; do
              gh release download "$tag" --pattern "$asset" --dir "$existing_dir" || {
                complete=false
                break
              }
            done
            if [[ "$complete" == true ]] && (
              cd "$existing_dir"
              sha256sum -c SHA256SUMS || exit
              for arch in x64 arm64; do
                artifact="github-desktop-${VERSION}-linux-${arch}.tar.gz"
                [[ "$(tar -xOf "$artifact" github-desktop/UPSTREAM_COMMIT)" == \
                  "${{ needs.resolve.outputs.commit }}" ]] || exit
              done
            ); then
              valid_remote=true
            fi
          fi
          if [[ "$valid_remote" == false ]]; then
            # A failed prior upload may leave a partial or internally mixed set.
            # Replace every expected asset together, including SHA256SUMS.
            gh release upload "$tag" --clobber "${expected_assets[@]}"
          fi
