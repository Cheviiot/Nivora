name: CI · Изменённые пакеты

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      packages:
        description: "all или package ID через пробел"
        required: true
        default: all
        type: string

permissions:
  contents: read

concurrency:
  group: nivora-packages-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: G0–G2 и план сборки
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
      has_packages: ${{ steps.plan.outputs.has_packages }}
      full: ${{ steps.plan.outputs.full }}
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Подготовить инструменты
        uses: ./.github/actions/setup-stplr-spec
        with:
          system-packages: jq rpm libarchive-tools shellcheck

      - name: Проверить обязательные G0–G2
        run: .github/tools/run_checks.sh

      - name: Выбрать изменённые пакеты
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REQUESTED_PACKAGES: ${{ inputs.packages }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            .github/tools/ci_plan.py \
              --packages "$REQUESTED_PACKAGES" \
              --github-output "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == pull_request ]]; then
            .github/tools/ci_plan.py \
              --base "$PR_BASE_SHA" --head HEAD \
              --github-output "$GITHUB_OUTPUT"
          else
            .github/tools/ci_plan.py \
              --base "$BEFORE_SHA" --head HEAD \
              --github-output "$GITHUB_OUTPUT"
          fi

  # Сверка upstream-версий остаётся частью единого CI: отдельный lightweight job
  # вместо прежнего дублирующего workflow, который прогонял run_checks.sh
  # второй раз на тех же событиях.
  versions:
    name: Сверка upstream-версий
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Подготовить инструменты
        uses: ./.github/actions/setup-stplr-spec
        with:
          system-packages: jq

      - name: Сверить upstream-версии
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          .github/tools/package_updates.sh check-all
          status=$?
          set -e
          if [[ "$status" -eq 10 ]]; then
            echo "::warning::Для одного или нескольких пакетов доступны обновления"
          elif [[ "$status" -ne 0 ]]; then
            exit "$status"
          fi

  alt:
    name: stable v0.2.0 ALT p11 · ${{ matrix.package }}
    needs: plan
    if: ${{ needs.plan.outputs.has_packages == 'true' }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Подготовить инструменты
        uses: ./.github/actions/setup-stplr-spec
        with:
          system-packages: rpm cpio libarchive-tools sqlite3

      # Build, package metadata, install, safe smoke and remove are gated in
      # disposable ALT p11 containers. GitHub has no native ALT runner.
      - name: Собрать и проверить артефакт
        env:
          NIVORA_STPLR_CHANNEL: stable
          NIVORA_ALT_BRANCH: p11
        run: |
          .github/tools/clean_build.sh "${{ matrix.package }}"
          .github/tools/verify_artifacts.sh "${{ matrix.package }}"

      - name: Проверить install/upgrade/remove
        env:
          NIVORA_STPLR_CHANNEL: stable
          NIVORA_ALT_BRANCH: p11
          NIVORA_LIFECYCLE_PACKAGES: ${{ matrix.package }}
        run: .github/tools/test_package_lifecycle.sh

      # Keep the very same RPM consumed by all lifecycle scenarios, not a rebuild.
      - name: Сохранить проверенный RPM плагина GNOME Software
        if: ${{ success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && matrix.package == 'gnome-software-plugin-stplr' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gnome-software-plugin-stplr-p11-x86_64-${{ github.sha }}-${{ github.run_attempt }}
          path: gnome-software-plugin-stplr/*.rpm
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  main-canary:
    name: advisory main ALT p11 · ${{ matrix.package }}
    needs: plan
    # Canary предупреждает о будущих несовместимостей Stapler: PR обходятся без
    # неё (каждый PR-джоб удваивал бы нагрузку), advisory-проверка остаётся на
    # push в main и ручных запусках.
    if: ${{ needs.plan.outputs.has_packages == 'true' && github.event_name != 'pull_request' }}
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      # The canary builds Stapler from source, and main now reaches
      # internal/usecase/support -> coreos/go-systemd/sdjournal, which is cgo
      # and needs systemd/sd-journal.h. Without it every canary job failed at
      # the same step, which is why the lane was uniformly red.
      - name: Подготовить инструменты
        uses: ./.github/actions/setup-stplr-spec
        with:
          system-packages: rpm cpio libarchive-tools libsystemd-dev

      - name: Собрать и проверить pinned main
        env:
          NIVORA_STPLR_CHANNEL: main
          NIVORA_ALT_BRANCH: p11
        run: |
          .github/tools/clean_build.sh "${{ matrix.package }}"
          .github/tools/verify_artifacts.sh "${{ matrix.package }}"

      - name: Отметить advisory-результат
        if: ${{ always() }}
        run: >-
          echo 'Pinned Stapler main canary is advisory; stable v0.2.0 remains the gate.'
          >>"$GITHUB_STEP_SUMMARY"
