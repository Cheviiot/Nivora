name: CI · Изменённые пакеты

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      packages:
        description: "all или package ID через пробел"
        required: true
        default: all
        type: string

permissions:
  contents: read

concurrency:
  group: nivora-packages-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: G0–G2 и план сборки
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
      has_packages: ${{ steps.plan.outputs.has_packages }}
      full: ${{ steps.plan.outputs.full }}
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Подготовить инструменты
        uses: ./.github/actions/setup-stplr-spec
        with:
          system-packages: jq rpm shellcheck

      - name: Проверить обязательные G0–G2
        run: .github/tools/run_checks.sh

      - name: Выбрать изменённые пакеты
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REQUESTED_PACKAGES: ${{ inputs.packages }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            .github/tools/ci_plan.py \
              --packages "$REQUESTED_PACKAGES" \
              --github-output "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == pull_request ]]; then
            .github/tools/ci_plan.py \
              --base "$PR_BASE_SHA" --head HEAD \
              --github-output "$GITHUB_OUTPUT"
          else
            .github/tools/ci_plan.py \
              --base "$BEFORE_SHA" --head HEAD \
              --github-output "$GITHUB_OUTPUT"
          fi

  alt:
    name: stable v0.1.1 ALT ${{ matrix.branch }} · ${{ matrix.package }}
    needs: plan
    if: ${{ needs.plan.outputs.has_packages == 'true' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        branch: [p11, sisyphus]
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Подготовить инструменты
        uses: ./.github/actions/setup-stplr-spec
        with:
          system-packages: rpm cpio sqlite3

      # Build, package metadata, install, safe smoke and remove all run against
      # the same disposable container of the branch under test. GitHub has no
      # ALT runner, so the container is the only honest place to gate this.
      - name: Собрать и проверить артефакт
        env:
          NIVORA_STPLR_CHANNEL: stable
          NIVORA_ALT_BRANCH: ${{ matrix.branch }}
        run: |
          .github/tools/clean_build.sh "${{ matrix.package }}"
          .github/tools/verify_artifacts.sh "${{ matrix.package }}"

      - name: Проверить install/upgrade/remove
        env:
          NIVORA_STPLR_CHANNEL: stable
          NIVORA_ALT_BRANCH: ${{ matrix.branch }}
          NIVORA_LIFECYCLE_PACKAGES: ${{ matrix.package }}
        run: .github/tools/test_package_lifecycle.sh

  main-canary:
    name: advisory main ALT sisyphus · ${{ matrix.package }}
    needs: plan
    if: ${{ needs.plan.outputs.has_packages == 'true' }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Подготовить инструменты
        uses: ./.github/actions/setup-stplr-spec
        with:
          system-packages: rpm cpio

      - name: Собрать и проверить pinned main
        env:
          NIVORA_STPLR_CHANNEL: main
          NIVORA_ALT_BRANCH: sisyphus
        run: |
          .github/tools/clean_build.sh "${{ matrix.package }}"
          .github/tools/verify_artifacts.sh "${{ matrix.package }}"

      - name: Отметить advisory-результат
        if: ${{ always() }}
        run: >-
          echo 'Pinned Stapler main canary is advisory; stable v0.1.1 remains the gate.'
          >>"$GITHUB_STEP_SUMMARY"
