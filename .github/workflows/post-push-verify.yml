name: CI · Проверка точного post-push SHA
run-name: post-push ${{ github.event_name == 'schedule' && github.sha || inputs.sha }} · updater ${{ inputs.updater_run_id }} · resume ${{ inputs.resume_on_success || github.event_name == 'schedule' }}

on:
  schedule:
    # Daily at 04:47 Asia/Vladivostok, independently of upstream updates.
    - cron: "47 18 * * *"
  workflow_dispatch:
    inputs:
      sha:
        description: "Полный 40-символьный commit SHA"
        required: true
        type: string
      updater_run_id:
        description: "ID исходного запуска updater"
        required: false
        type: string
      resume_on_success:
        description: "Проверить все пакеты и снять паузу после успеха"
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: nivora-post-push-${{ github.event_name == 'schedule' && github.sha || inputs.sha }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Проверить точный SHA и G0–G2
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
      has_packages: ${{ steps.plan.outputs.has_packages }}
    steps:
      - name: Проверить формат SHA
        env:
          REQUESTED_SHA: ${{ github.event_name == 'schedule' && github.sha || inputs.sha }}
        run: |
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Получить точный опубликованный commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event_name == 'schedule' && github.sha || inputs.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Убедиться, что checkout точный
        env:
          REQUESTED_SHA: ${{ github.event_name == 'schedule' && github.sha || inputs.sha }}
        run: |
          [[ "$(git rev-parse HEAD)" == "$REQUESTED_SHA" ]]

      - name: Подготовить инструменты
        uses: ./.github/actions/setup-stplr-spec
        with:
          system-packages: jq rpm shellcheck

      - name: Проверить обязательные G0–G2
        run: .github/tools/run_checks.sh

      - name: Выбрать изменённые пакеты
        id: plan
        env:
          RESUME_ON_SUCCESS: ${{ inputs.resume_on_success || github.event_name == 'schedule' }}
        run: |
          if [[ "$RESUME_ON_SUCCESS" == true ]]; then
            .github/tools/ci_plan.py --packages all \
              --github-output "$GITHUB_OUTPUT"
          else
            .github/tools/ci_plan.py --base HEAD^ --head HEAD \
              --github-output "$GITHUB_OUTPUT"
          fi

  stable:
    name: post-push stable ALT p11 · ${{ matrix.package }}
    needs: plan
    if: ${{ needs.plan.outputs.has_packages == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
      max-parallel: 8
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Получить точный commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event_name == 'schedule' && github.sha || inputs.sha }}
          persist-credentials: false

      - name: Подготовить инструменты
        uses: ./.github/actions/setup-stplr-spec
        with:
          system-packages: rpm cpio sqlite3

      - name: Собрать и проверить stable v0.2.0
        env:
          NIVORA_STPLR_CHANNEL: stable
          NIVORA_ALT_BRANCH: p11
          NIVORA_LIFECYCLE_PACKAGES: ${{ matrix.package }}
        run: |
          .github/tools/clean_build.sh "${{ matrix.package }}"
          .github/tools/verify_artifacts.sh "${{ matrix.package }}"
          .github/tools/test_package_lifecycle.sh

  reconcile:
    name: Управление паузой updater
    if: ${{ always() }}
    needs: [plan, stable]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Получить скрипт управления
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Приостановить updater после сбоя
        if: >-
          ${{
            github.event_name != 'schedule' &&
            (
              needs.plan.result != 'success' ||
              needs.stable.result == 'failure' ||
              needs.stable.result == 'cancelled'
            )
          }}
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ github.event_name == 'schedule' && github.sha || inputs.sha }}
        run: .github/tools/reconcile_updater_pause.sh failure "$REQUESTED_SHA"

      - name: Сообщить о сбое ежедневной проверки
        if: >-
          ${{
            github.event_name == 'schedule' &&
            (
              needs.plan.result != 'success' ||
              needs.stable.result == 'failure' ||
              needs.stable.result == 'cancelled'
            )
          }}
        run: |
          cat >>"$GITHUB_STEP_SUMMARY" <<'EOF'
          ### Ежедневная полная проверка не прошла

          Этот запуск не меняет состояние паузы updater. Ежечасная проверка
          продолжит искать обновления, если updater не был приостановлен раньше.
          Это позволяет обновить изменившиеся /latest/ источники и их checksums.
          Каждый кандидат обязан пройти все проверки до публикации.
          EOF

      - name: Восстановить обновления после полной проверки текущего main
        if: >-
          ${{
            needs.plan.result == 'success' &&
            needs.stable.result == 'success' &&
            (inputs.resume_on_success == true || github.event_name == 'schedule')
          }}
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ github.event_name == 'schedule' && github.sha || inputs.sha }}
        run: .github/tools/reconcile_updater_pause.sh success "$REQUESTED_SHA"

      - name: Завершить workflow ошибкой при сбое gate
        if: >-
          ${{
            needs.plan.result != 'success' ||
            needs.stable.result == 'failure' ||
            needs.stable.result == 'cancelled'
          }}
        run: exit 1
