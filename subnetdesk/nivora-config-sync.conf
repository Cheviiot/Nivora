# Приложение предлагает перенести личность пользователя в конфигурацию
# root-службы само, но его диалог пароля отправляет первую попытку
# автоматически и с пустым значением, так что «Sorry, try again.» появляется до
# ввода (подробности в subnetdesk/README.md). Служба делает ту же работу при
# каждом запуске, и диалог не нужен.
#
# ExecStartPre с ведущим «-»: неудача синхронизации не должна мешать службе
# подняться — без неё она просто обслуживает собственную личность.
[Service]
ExecStartPre=-/usr/bin/subnetdesk-service-config --quiet
